<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zebra Riddle 斑馬難題邏輯推理輔助器</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f8f9fa;
      font-size: 0.9rem;
    }

    .nav-tabs .nav-link.active {
      font-weight: bold;
      border-top: 3px solid #0d6efd;
    }

    .card-header {
      font-weight: 600;
      background-color: #f1f5f9;
    }

    .table-custom-header th {
      background-color: #e2e8f0;
      text-align: center;
      vertical-align: middle;
    }

    .cell-center {
      text-align: center;
      vertical-align: middle;
    }

    .pos-badge {
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 1px;
      font-size: 0.85rem;
    }

    .mono {
      font-family: monospace;
    }

    .grid-table td,
    .grid-table th {
      padding: 0.4rem;
    }

    .bg-possibility {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    /* 雙行表格專用樣式 */
    .compact-grid th,
    .compact-grid td {
      vertical-align: middle;
      text-align: center;
      padding: 0.35rem 0.5rem;
    }

    .compact-grid .feature-label {
      background-color: #f8fafc;
      font-weight: bold;
      width: 100px;
      white-space: nowrap;
    }

    .compact-grid .val-header {
      background-color: #f1f5f9;
      font-weight: 600;
      white-space: nowrap;
    }

    .compact-grid .pos-row {
      background-color: #ffffff;
    }

    /* 已確定規則樣式 (淡化與沉底) */
    .rule-completed {
      background-color: #f8f9fa !important;
      opacity: 0.55;
    }

    .rule-completed:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container-fluid py-3 px-4">
    <!-- 頁頭標題與匯入匯出操作區 -->
    <header class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom flex-wrap gap-2">
      <h3 class="fw-bold text-primary mb-0">
        <i class="bi bi-puzzle-fill me-2"></i>Zebra Riddle 斑馬難題視覺化推理助手
      </h3>

      <!-- 匯入與匯出按鈕群組 -->
      <div class="btn-toolbar gap-2">
        <div class="btn-group btn-group-sm" role="group">
          <button class="btn btn-outline-primary" onclick="exportData(false)">
            <i class="bi bi-download me-1"></i> 匯出題目
          </button>
          <button class="btn btn-outline-primary" onclick="exportData(true)">
            <i class="bi bi-file-earmark-arrow-down me-1"></i> 匯出題目與解答
          </button>
        </div>
        <div class="btn-group btn-group-sm" role="group">
          <button class="btn btn-outline-success" onclick="triggerImport(false)">
            <i class="bi bi-upload me-1"></i> 匯入題目
          </button>
          <button class="btn btn-outline-success" onclick="triggerImport(true)">
            <i class="bi bi-file-earmark-arrow-up me-1"></i> 匯入題目與解答
          </button>
        </div>
        <!-- 隱藏的 File Input 用於選取 JSON -->
        <input type="file" id="import-file-input" accept=".json" style="display: none;"
          onchange="handleFileImport(event)">
      </div>
    </header>

    <!-- 功能頁簽 Navigation -->
    <ul class="nav nav-tabs mb-3" id="mainTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="config-tab" data-bs-toggle="tab" data-bs-target="#config-pane" type="button"
          role="tab">
          <i class="bi bi-gear-fill me-1"></i> 1. 個體特徵設定
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="rules-tab" data-bs-toggle="tab" data-bs-target="#rules-pane" type="button"
          role="tab">
          <i class="bi bi-list-check me-1"></i> 2. 規則選擇與設定
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="solve-tab" data-bs-toggle="tab" data-bs-target="#solve-pane" type="button"
          role="tab">
          <i class="bi bi-lightning-charge-fill me-1"></i> 3. 推理互動工作區
        </button>
      </li>
    </ul>

    <!-- 頁簽內容區域 Tab Contents -->
    <div class="tab-content" id="mainTabsContent">

      <!-- ==================== 1. 個體特徵設定頁簽 ==================== -->
      <div class="tab-pane fade show active" id="config-pane" role="tabpanel">
        <div class="row g-3">
          <!-- 個體與特徵數量設定 -->
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-header"><i class="bi bi-sliders me-1"></i> 基礎規模控制</div>
              <div class="card-body">
                <div class="mb-3">
                  <label class="form-label fw-bold">個體數量 (N 個位置)</label>
                  <div class="input-group">
                    <button class="btn btn-outline-secondary" onclick="changeEntityCount(-1)">-</button>
                    <input type="number" id="entity-count" class="form-control text-center" value="5" min="2" max="10"
                      readonly>
                    <button class="btn btn-outline-secondary" onclick="changeEntityCount(1)">+</button>
                  </div>
                  <div class="form-text">代表由左至右排成一列的位置 (1 ~ N)。</div>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">特徵維度數量 (M 個類別)</label>
                  <button class="btn btn-sm btn-primary w-100 mt-1" onclick="addFeature()">
                    <i class="bi bi-plus-circle me-1"></i> 新增特徵類別
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- 特徵類別與可能值設定 -->
          <div class="col-md-8">
            <div class="card shadow-sm">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-tags-fill me-1"></i> 特徵類別與可能值增修 (各類別需有 N 個可能值)</span>
              </div>
              <div class="card-body" id="feature-list-container">
                <!-- 動態生成特徵設定項 -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ==================== 2. 規則選擇與設定頁簽 ==================== -->
      <div class="tab-pane fade" id="rules-pane" role="tabpanel">
        <div class="row g-3">
          <!-- 新增規則控制台 -->
          <div class="col-md-5">
            <div class="card shadow-sm">
              <div class="card-header"><i class="bi bi-file-earmark-plus-fill me-1"></i> 新增限制條件</div>
              <div class="card-body">
                <form id="rule-form">
                  <div class="mb-3">
                    <label class="form-label fw-bold">1. 選擇限制條件類型</label>
                    <select id="rule-type-select" class="form-select" onchange="renderRuleFormInputs()">
                      <option value="EXACT_POS">確定位置 (A 位於第 K 個位置)</option>
                      <option value="ADJACENT">相鄰 (A 與 B 相鄰，順序不限)</option>
                      <option value="ORDERED_DIR">確定順序 (A 在 B 的左邊/右邊，不一定相鄰)</option>
                      <option value="ORDERED_ADJ">確定順序且相鄰 (A 在 B 的左邊/右邊隔壁)</option>
                      <option value="THREE_ORDERED">三者確定順序 (A, B, C 依序排列)</option>
                      <option value="POSSIBLE_POS">可能位置 (A 位於 K1 或 K2 位置)</option>
                      <option value="SAME_ENTITY">確定相同 (A 就是 B，同一個體)</option>
                    </select>
                  </div>

                  <!-- 動態切換的參數輸入組件 -->
                  <div id="rule-inputs-container" class="mb-3 p-3 bg-light rounded border">
                    <!-- JS 動態生成 -->
                  </div>

                  <button type="button" class="btn btn-success w-100" onclick="addRule()">
                    <i class="bi bi-plus-lg me-1"></i> 加入限制條件列表
                  </button>
                </form>
              </div>
            </div>
          </div>

          <!-- 已建立規則列表 -->
          <div class="col-md-7">
            <div class="card shadow-sm">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-card-checklist me-1"></i> 當前題目限制條件清單</span>
                <span class="badge bg-primary" id="rule-count-badge">0 條規則</span>
              </div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th style="width: 10%">#</th>
                        <th style="width: 25%">類型</th>
                        <th>規則簡要描述</th>
                        <th style="width: 15%" class="text-center">操作</th>
                      </tr>
                    </thead>
                    <tbody id="rules-table-body">
                      <!-- 動態渲染已加規則 -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ==================== 3. 推理互動工作區頁簽 ==================== -->
      <div class="tab-pane fade" id="solve-pane" role="tabpanel">

        <!-- 上方三大區域：解答區 | 特徵值剩餘位置區 | 特徵值可行位置區 -->
        <div class="row g-3 mb-3">

          <!-- 1. 解答區 (包含新增的自動推理按鈕) -->
          <div class="col-xl-4 col-lg-12">
            <div class="card shadow-sm h-100 border-primary">
              <div
                class="card-header bg-primary text-white d-flex justify-content-between align-items-center flex-wrap gap-1">
                <span class="fw-bold"><i class="bi bi-pencil-square me-1"></i> 解答區</span>
                <div class="d-flex gap-1">
                  <!-- ✨ 數獨邏輯自動推理按鈕 -->
                  <button class="btn btn-sm btn-warning fw-bold px-2 py-0" onclick="autoSolveStepByStep()"
                    title="套用數獨邏輯，自動推導直到卡住">
                    <i class="bi bi-robot me-1"></i> 自動推理
                  </button>
                  <button class="btn btn-sm btn-light py-0 text-primary fw-bold"
                    onclick="resetUserChoices()">重置</button>
                </div>
              </div>
              <div class="card-body p-2 overflow-auto">
                <table class="table table-bordered grid-table align-middle mb-0" id="answer-grid"><!-- 動態生成解答表格 --></table>
              </div>
            </div>
          </div>

          <!-- 2. 特徵值剩餘位置區 -->
          <div class="col-xl-4 col-lg-6">
            <div class="card shadow-sm h-100">
              <div class="card-header bg-secondary text-white fw-bold">
                <i class="bi bi-funnel-fill me-1"></i> 特徵值剩餘位置區 (基於解答區推導)
              </div>
              <div class="card-body p-2 overflow-auto">
                <table class="table table-sm table-bordered compact-grid align-middle mb-0" id="remaining-pos-grid">
                  <!-- 動態生成特徵值雙行剩餘位置表格 -->
                </table>
              </div>
            </div>
          </div>

          <!-- 3. 特徵值可行位置區 -->
          <div class="col-xl-4 col-lg-6">
            <div class="card shadow-sm h-100 border-success">
              <div class="card-header bg-success text-white fw-bold">
                <i class="bi bi-check-all me-1"></i> 特徵值可行位置區 (規則綜合交集)
              </div>
              <div class="card-body p-2 overflow-auto">
                <table class="table table-sm table-bordered compact-grid align-middle mb-0" id="feasible-pos-grid">
                  <!-- 動態生成特徵值雙行可行位置表格 -->
                </table>
              </div>
            </div>
          </div>

        </div>

        <!-- 下方大區塊：規則展示與特徵可行位置區 -->
        <div class="row">
          <div class="col-12">
            <div class="card shadow-sm">
              <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center fw-bold">
                <span><i class="bi bi-diagram-3-fill me-1"></i> 規則展示與特徵可行位置推理分析區</span>
                <small class="text-white-50 fw-normal"><i class="bi bi-info-circle me-1"></i>完全確定的規則會自動排序置底並淡化</small>
              </div>
              <div class="card-body p-0 overflow-auto">
                <table class="table table-bordered align-middle mb-0" id="rule-analysis-table">
                  <thead class="table-custom-header">
                    <tr>
                      <th style="width: 22%;">規則簡要描述</th>
                      <th style="width: 43%;">該規則牽涉的特徵值所有可能的排列方式<br><small
                          class="text-muted fw-normal">(對應之符合可行位置)</small></th>
                      <th style="width: 15%;">該規則牽涉特徵值</th>
                      <th style="width: 20%;">該特徵值所有可行位置<br><small class="text-muted fw-normal">(併集工程合併)</small></th>
                    </tr>
                  </thead>
                  <tbody id="rule-analysis-tbody">
                    <!-- 動態生成規則推理列 -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ==========================================
    // 全局資料結構與預設範例
    // ==========================================
    let state = {
      entityCount: 5,
      features: [
        { name: "國籍", values: ["英國人", "瑞典人", "丹麥人", "挪威人", "德意志"] },
        { name: "顏色", values: ["紅房子", "綠房子", "白房子", "黃房子", "藍房子"] },
        { name: "飲料", values: ["茶", "咖啡", "牛奶", "啤酒", "水"] },
        { name: "寵物", values: ["狗", "鳥", "貓", "馬", "斑馬"] },
        { name: "抽菸", values: ["Blends", "Blue Master", "Dunhill", "Pall Mall", "Prince"] }
      ],
      rules: [
        {
          "id": 1,
          "type": "EXACT_POS",
          "val": "挪威人",
          "pos": 1,
          "desc": "挪威人 住 第一間房子"
        },
        {
          "id": 2,
          "type": "EXACT_POS",
          "val": "牛奶",
          "pos": 3,
          "desc": "住在 中間(第3間) 的人喝 牛奶"
        },
        {
          "id": 3,
          "type": "SAME_ENTITY",
          "val1": "英國人",
          "val2": "紅房子",
          "desc": "英國人 住 紅房子"
        },
        {
          "id": 4,
          "type": "ORDERED_ADJ",
          "dir": "left",
          "val1": "綠房子",
          "val2": "白房子",
          "desc": "綠房子 在 白房子 的 左側隔壁"
        },
        {
          "id": 5,
          "type": "SAME_ENTITY",
          "val1": "丹麥人",
          "val2": "茶",
          "desc": "丹麥人 喝 茶"
        },
        {
          "id": 6,
          "type": "ADJACENT",
          "val1": "挪威人",
          "val2": "藍房子",
          "desc": "挪威人 和 住藍房子 的人 相鄰"
        },
        {
          "id": 7,
          "type": "SAME_ENTITY",
          "val1": "瑞典人",
          "val2": "狗",
          "desc": "瑞典人 養 狗"
        },
        {
          "id": 8,
          "type": "SAME_ENTITY",
          "val1": "綠房子",
          "val2": "咖啡",
          "desc": "住綠房子 的人 喝 咖啡"
        },
        {
          "id": 9,
          "type": "SAME_ENTITY",
          "val1": "Pall Mall",
          "val2": "鳥",
          "desc": "抽 Pall Mall 的人 養 鳥"
        },
        {
          "id": 10,
          "type": "SAME_ENTITY",
          "val1": "黃房子",
          "val2": "Dunhill",
          "desc": "住黃房子 的人 抽 Dunhill"
        },
        {
          "id": 11,
          "type": "ADJACENT",
          "val1": "Blends",
          "val2": "貓",
          "desc": "抽 Blends 的人與 養 貓 的人相鄰"
        },
        {
          "id": 12,
          "type": "ADJACENT",
          "val1": "馬",
          "val2": "Dunhill",
          "desc": "養 馬 的人與 抽 Dunhill 的人相鄰"
        },
        {
          "id": 13,
          "type": "SAME_ENTITY",
          "val1": "Blue Master",
          "val2": "啤酒",
          "desc": "抽 Blue Master 的人 喝 啤酒"
        },
        {
          "id": 14,
          "type": "SAME_ENTITY",
          "val1": "德意志",
          "val2": "Prince",
          "desc": "德意志人 抽 Prince"
        },
        {
          "id": 15,
          "type": "ADJACENT",
          "val1": "Blends",
          "val2": "水",
          "desc": "抽 Blends 的人與 喝 水 的人相鄰"
        }
      ],
      userGrid: {}
    };

    let importIncludeAnswers = false; // 紀錄匯入模式

    // 頁面初始化
    document.addEventListener('DOMContentLoaded', () => {
      initUserGrid();
      renderFeatureConfig();
      renderRulesTable();
      renderRuleFormInputs();

      // 綁定頁簽切換觸發推理渲染
      document.getElementById('solve-tab').addEventListener('shown.bs.tab', () => {
        updateSolveWorkspace();
      });
    });

    // 初始化解答區選單
    function initUserGrid() {
      state.userGrid = {};
      state.features.forEach((_, fIdx) => {
        state.userGrid[fIdx] = {};
        for (let p = 1; p <= state.entityCount; p++) {
          state.userGrid[fIdx][p] = ""; // 空白代表未確定
        }
      });
    }

    // ==========================================
    // 匯入與匯出功能
    // ==========================================
    function exportData(includeAnswers) {
      const dataToExport = {
        entityCount: state.entityCount,
        features: state.features,
        rules: state.rules
      };
      if (includeAnswers) dataToExport.userGrid = state.userGrid;

      const jsonStr = JSON.stringify(dataToExport, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = includeAnswers ? `zebra_puzzle_with_answers.json` : `zebra_puzzle_question.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function triggerImport(includeAnswers) {
      importIncludeAnswers = includeAnswers;
      const fileInput = document.getElementById('import-file-input');
      fileInput.value = ''; // 清空以確保能重複觸發 onchange
      fileInput.click();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (!importedData.entityCount || !importedData.features || !importedData.rules) {
            throw new Error("無效的 JSON 結構！");
          }

          state.entityCount = importedData.entityCount;
          document.getElementById('entity-count').value = state.entityCount;
          state.features = importedData.features;
          state.rules = importedData.rules;

          initUserGrid();
          if (importIncludeAnswers && importedData.userGrid) {
            state.userGrid = importedData.userGrid;
          }

          renderFeatureConfig();
          renderRulesTable();
          renderRuleFormInputs();
          updateSolveWorkspace();

          alert(importIncludeAnswers ? "題目與解答匯入成功！" : "題目匯入成功！");
        } catch (err) {
          alert("匯入失敗：檔案格式不正確！" + err.message);
        }
      };
      reader.readAsText(file);
    }

    // ==========================================
    // 個體與特徵設定
    // ==========================================
    function changeEntityCount(delta) {
      const newCount = state.entityCount + delta;
      if (newCount < 2 || newCount > 8) return;
      state.entityCount = newCount;
      document.getElementById('entity-count').value = newCount;

      // 校正特徵值數量符合 N
      state.features.forEach(f => {
        while (f.values.length < newCount) f.values.push(`${f.name}_${f.values.length + 1}`);
        while (f.values.length > newCount) f.values.pop();
      });

      initUserGrid();
      renderFeatureConfig();
    }

    function addFeature() {
      const fIndex = state.features.length + 1;
      const fName = `特徵${fIndex}`;
      const values = [];
      for (let i = 1; i <= state.entityCount; i++) values.push(`${fName}_值${i}`);
      state.features.push({ name: fName, values: values });
      initUserGrid();
      renderFeatureConfig();
    }

    function removeFeature(fIdx) {
      if (state.features.length <= 1) {
        alert("至少需要保留一個特徵類別！");
        return;
      }
      state.features.splice(fIdx, 1);
      initUserGrid();
      renderFeatureConfig();
    }

    function renderFeatureConfig() {
      const container = document.getElementById('feature-list-container');
      container.innerHTML = '';

      state.features.forEach((feat, fIdx) => {
        const card = document.createElement('div');
        card.className = 'card mb-3 border';
        card.innerHTML = `
      <div class="card-body p-3">
        <div class="row g-2 align-items-center mb-2">
          <div class="col-md-4">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-light fw-bold">特徵類別</span>
              <input type="text" class="form-control" value="${feat.name}" onchange="updateFeatureName(${fIdx}, this.value)">
            </div>
          </div>
          <div class="col-md-8 text-end">
            <button class="btn btn-outline-danger btn-sm" onclick="removeFeature(${fIdx})">
              <i class="bi bi-trash"></i> 刪除此類別
            </button>
          </div>
        </div>
        <div>
          <label class="form-label small text-muted mb-1">可能值列表 (需為 ${state.entityCount} 個不重複值)：</label>
          <div class="d-flex flex-wrap gap-2">
            ${feat.values.map((v, vIdx) => `
              <input type="text" class="form-control form-control-sm" style="width: 110px;" 
                     value="${v}" onchange="updateFeatureValue(${fIdx}, ${vIdx}, this.value)">
            `).join('')}
          </div>
        </div>
      </div>
    `;
        container.appendChild(card);
      });
    }

    function updateFeatureName(fIdx, name) { state.features[fIdx].name = name; }
    function updateFeatureValue(fIdx, vIdx, val) { state.features[fIdx].values[vIdx] = val; }

      // 輔助函式：取得所有特徵值的扁平清單
    function getAllValues() {
      let list = [];
      state.features.forEach(f => list.push(...f.values));
      return list;
    }

    // ==========================================
    // 規則選擇與設定
    // ==========================================
    function renderRuleFormInputs() {
      const type = document.getElementById('rule-type-select').value;
      const container = document.getElementById('rule-inputs-container');
      const allVals = getAllValues();

      let html = '';
      const makeSelect = (id, label) => `
    <div class="mb-2">
      <label class="form-label small fw-bold mb-1">${label}</label>

        ${allVals.map(v => `<option value="${v}">${v}</option>`).join('')}
      </select>
    </div>
  `;

      const makePosSelect = (id, label) => `
    <div class="mb-2">
      <label class="form-label small fw-bold mb-1">${label}</label>
      <select id="${id}" class="form-select form-select-sm">

      </select>

  `;

      switch (type) {
        case 'EXACT_POS':

          break;
        case 'ORDERED_DIR':
        case 'ORDERED_ADJ':
          html = makeSelect('r-val1', '特徵值 A') +
            `<div class="mb-2"><label class="form-label small fw-bold mb-1">相對方位</label>
              <select id="r-dir" class="form-select form-select-sm">
                <option value="left">位於 左側</option>
                <option value="right">位於 右側</option>
              </select></div>` +
            makeSelect('r-val2', '特徵值 B');
          break;
        case 'THREE_ORDERED':
          html = makeSelect('r-val1', '特徵值 A (最左)') +
            makeSelect('r-val2', '特徵值 B (中間)') +
            makeSelect('r-val3', '特徵值 C (最右)');
          break;
        case 'POSSIBLE_POS':
          html = makeSelect('r-val1', '特徵值') +
            makePosSelect('r-pos1', '可能位置 1') +
            makePosSelect('r-pos2', '可能位置 2');
          break;
        case 'SAME_ENTITY':
          html = makeSelect('r-val1', '特徵值 A') + makeSelect('r-val2', '特徵值 B (不同特徵)');
          break;
      }
      container.innerHTML = html;
    }

    function addRule() {
      const type = document.getElementById('rule-type-select').value;
      const getV = id => document.getElementById(id)?.value;
      let rule = { id: Date.now(), type };

      switch (type) {
        case 'EXACT_POS':
          rule.val = getV('r-val1');
          rule.pos = parseInt(getV('r-pos1'));
          rule.desc = `${rule.val} 位於 第 ${rule.pos} 個位置`;
          break;
        case 'ADJACENT':
          rule.val1 = getV('r-val1');
          rule.val2 = getV('r-val2');
          rule.desc = `${rule.val1} 與 ${rule.val2} 相鄰`;
          break;
        case 'ORDERED_DIR':
          rule.val1 = getV('r-val1');
          rule.val2 = getV('r-val2');
          rule.dir = getV('r-dir');
          rule.desc = `${rule.val1} 在 ${rule.val2} 的 ${rule.dir === 'left' ? '左側' : '右側'}`;
          break;
        case 'ORDERED_ADJ':
          rule.val1 = getV('r-val1');
          rule.val2 = getV('r-val2');
          rule.dir = getV('r-dir');
          rule.desc = `${rule.val1} 在 ${rule.val2} 的 ${rule.dir === 'left' ? '左側隔壁' : '右側隔壁'}`;
          break;
        case 'THREE_ORDERED':
          rule.val1 = getV('r-val1');
          rule.val2 = getV('r-val2');
          rule.val3 = getV('r-val3');
          rule.desc = `${rule.val1}, ${rule.val2}, ${rule.val3} 按此順序排列`;
          break;
        case 'POSSIBLE_POS':
          rule.val = getV('r-val1');
          rule.pos1 = parseInt(getV('r-pos1'));
          rule.pos2 = parseInt(getV('r-pos2'));
          rule.desc = `${rule.val} 位於 第 ${rule.pos1} 或 第 ${rule.pos2} 位置`;
          break;
        case 'SAME_ENTITY':
          rule.val1 = getV('r-val1');
          rule.val2 = getV('r-val2');
          rule.desc = `${rule.val1} 與 ${rule.val2} 是同一個體`;
          break;
      }

      state.rules.push(rule);
      renderRulesTable();
    }

    function removeRule(id) {
      state.rules = state.rules.filter(r => r.id !== id);
      renderRulesTable();
    }

    function renderRulesTable() {
      const tbody = document.getElementById('rules-table-body');
      document.getElementById('rule-count-badge').innerText = `${state.rules.length} 條規則`;
      tbody.innerHTML = '';

      state.rules.forEach((r, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
      <td>${idx + 1}</td>
      <td><span class="badge bg-outline-dark text-dark border">${r.type}</span></td>
      <td class="fw-bold">${r.desc}</td>
      <td class="text-center">
        <button class="btn btn-sm btn-outline-danger" onclick="removeRule(${r.id})">
          <i class="bi bi-x-lg"></i>
        </button>
      </td>
    `;
        tbody.appendChild(tr);
      });
    }

    // ==========================================
    // 推理互動工作區與自動推導核心邏輯
    // ==========================================

    function updateSolveWorkspace() {
      renderAnswerGrid();

      // Step A: 計算「解答區推導之特徵值剩餘位置」
      const remainingPosMap = computeRemainingPositions();
      renderTwoRowPositionGrid('remaining-pos-grid', remainingPosMap, 'secondary');

      // Step B: 計算「規則展示與特徵可行位置區」的各規則分析
      const ruleAnalysisResults = computeRuleAnalysis(remainingPosMap);

      // Step C: 綜合各規則可行位置求交集，計算出「特徵值可行位置區」
      const finalFeasibleMap = computeFinalFeasiblePositions(remainingPosMap, ruleAnalysisResults);

      // 渲染規則分析表時，傳入 finalFeasibleMap 判斷是否全確定以排序 (功能 3)
      renderRuleAnalysisTable(ruleAnalysisResults, finalFeasibleMap);
      renderTwoRowPositionGrid('feasible-pos-grid', finalFeasibleMap, 'dynamic');

      return finalFeasibleMap;
    }

    // 🤖 數獨自動推理核心功能：重複計算直到無法產生新資訊
    function autoSolveStepByStep() {
      let changedInLoop = false;
      let totalSteps = 0;
      const maxLoops = 50; // 防呆安全閥

      for (let loop = 0; loop < maxLoops; loop++) {
        let currentFeasibleMap = updateSolveWorkspace();
        let stepChanged = false;

        // 巡檢所有特徵類別與特徵值
        state.features.forEach((feat, fIdx) => {
          feat.values.forEach(val => {
            const feasiblePositions = currentFeasibleMap[val] || [];

            // 數獨邏輯：若可行位置縮減至「唯一 1 個位置」，且該位置尚未填入解答區
            if (feasiblePositions.length === 1) {
              const targetPos = feasiblePositions[0];
              if (state.userGrid[fIdx][targetPos] !== val) {
                state.userGrid[fIdx][targetPos] = val;
                stepChanged = true;
                changedInLoop = true;
              }
            }
          });
        });

        // 若本輪沒有任何新單元格被確定，表示推導已卡住/收斂，跳出迴圈
        if (!stepChanged) break;
        totalSteps++;
      }

      // 更新最終 UI 畫面
      updateSolveWorkspace();

      if (totalSteps > 0) {
        alert(`自動推理完成！共進行了 ${totalSteps} 輪數獨推導填入。`);
      } else {
        alert("無法繼續推理：目前資訊不足以產生確定項，或解答已完全填滿。");
      }
    }

    // 渲染「解答區」表格
    function renderAnswerGrid() {
      const grid = document.getElementById('answer-grid');
      let html = `<thead><tr class="table-light"><th style="width:100px;">特徵類別</th>`;
      for (let p = 1; p <= state.entityCount; p++) {
        html += `<th class="text-center">位置 ${p}</th>`;
      }
      html += `</tr></thead><tbody>`;

      state.features.forEach((feat, fIdx) => {
        // 收集目前特徵類別在解答區中已選取的值集合
        const usedValuesInFeature = new Set();
        for (let p = 1; p <= state.entityCount; p++) {
          const v = state.userGrid[fIdx][p];
          if (v) usedValuesInFeature.add(v);
        }

        html += `<tr><td class="fw-bold bg-light">${feat.name}</td>`;
        for (let p = 1; p <= state.entityCount; p++) {
          const selectedVal = state.userGrid[fIdx][p] || "";

          html += `<td>
        <select class="form-select form-select-sm ${selectedVal ? 'bg-warning-subtle fw-bold' : ''}" 
                onchange="onUserSelectChange(${fIdx}, ${p}, this.value)">
          <option value="">-- 未定 --</option>
          ${feat.values.map(v => {
            const isSelectedHere = (selectedVal === v);
            // 若該值已經在別的位置被選走，則 disable
            const isDisabled = !isSelectedHere && usedValuesInFeature.has(v);
            return `<option value="${v}" ${isSelectedHere ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}>${v}</option>`;
          }).join('')}
        </select>
      </td>`;
        }
        html += `</tr>`;
      });
      html += `</tbody>`;
      grid.innerHTML = html;
    }

    function onUserSelectChange(fIdx, pos, value) {
      state.userGrid[fIdx][pos] = value;
      updateSolveWorkspace();
    }

    function resetUserChoices() {
      initUserGrid();
      updateSolveWorkspace();
    }

    // Step A: 計算每個特徵值在「解答區」約束下，還剩哪些可能位置
    function computeRemainingPositions() {
      let remMap = {};
      const N = state.entityCount;

      state.features.forEach((feat, fIdx) => {
        // 找出目前在該特徵類別中已經被選定的值與佔據的位置
        let selectedValues = {};
        let occupiedPositions = new Set();

        for (let p = 1; p <= N; p++) {
          const val = state.userGrid[fIdx][p];
          if (val) {
            selectedValues[val] = p;
            occupiedPositions.add(p);
          }
        }

        feat.values.forEach(v => {
          if (selectedValues[v]) {
            // 若該值已經在解答區指定，則只有該位置
            remMap[v] = [selectedValues[v]];
          } else {
            // 否則為所有「尚未被該特徵其他值佔據的位置」
            let possible = [];
            for (let p = 1; p <= N; p++) {
              if (!occupiedPositions.has(p)) {
                possible.push(p);
              }
            }
            remMap[v] = possible;
          }
        });
      });

      return remMap;
    }

    /**
     * 通用函式：渲染「雙行交錯」的特徵位置網格 (符合要求之介面)
     * @param {string} tableId - HTML 表格 ID
     * @param {object} posMap - { 特徵值: [位置陣列] }
     * @param {string} badgeType - Badge 顏色樣式 ('secondary' 或 'dynamic')
     */
    function renderTwoRowPositionGrid(tableId, posMap, badgeType) {
      const table = document.getElementById(tableId);
      let html = '<tbody>';

      state.features.forEach(feat => {

      // 第一行：特徵類別名稱 (跨2列) + 該類別所有特徵值
        html += `<tr>`;
        html += `<td rowspan="2" class="feature-label">${feat.name}</td>`;
        feat.values.forEach(v => {
          html += `<td class="val-header">${v}</td>`;
        });
        html += `</tr>`;

        // 第二行：該類別所有特徵值對應的位置 Badge
        html += `<tr class="pos-row mb-2">`;
        feat.values.forEach(v => {
          const posList = posMap[v] || [];
          const posStr = posList.length > 0 ? posList.join(',') : '無解';

          let badgeClass = 'bg-secondary';
          if (badgeType === 'dynamic') {
            if (posList.length === 1) badgeClass = 'bg-success';
            else if (posList.length === 0) badgeClass = 'bg-danger';
            else badgeClass = 'bg-primary';
          }

          html += `<td><span class="badge ${badgeClass} pos-badge">${posStr}</span></td>`;
        });
        html += `</tr>`;
      });

      html += '</tbody>';
      table.innerHTML = html;
    }

    // Step B: 解析每條規則，產生排列樣式與可行位置對應
    function computeRuleAnalysis(remMap) {
      const N = state.entityCount;
      let results = [];

      state.rules.forEach(rule => {
        let patterns = [];
        let involvedValues = [];

        switch (rule.type) {
          case 'EXACT_POS': {
            involvedValues = [rule.val];
            patterns.push({
              expr: `${rule.val} [在 ${rule.pos}]`,
              feasMap: { [rule.val]: [rule.pos] }
            });
            break;
          }
          case 'ADJACENT': {
            involvedValues = [rule.val1, rule.val2];
            // 兩種可能順序: A|B 或 B|A
            patterns.push(evalPatternAdjacent(rule.val1, rule.val2, remMap, N));
            patterns.push(evalPatternAdjacent(rule.val2, rule.val1, remMap, N));
            break;
          }
          case 'ORDERED_ADJ': {
            involvedValues = [rule.val1, rule.val2];
            if (rule.dir === 'left') {
              patterns.push(evalPatternAdjacent(rule.val1, rule.val2, remMap, N));
            } else {
              patterns.push(evalPatternAdjacent(rule.val2, rule.val1, remMap, N));
            }
            break;
          }
          case 'ORDERED_DIR': {
            involvedValues = [rule.val1, rule.val2];
            const leftVal = rule.dir === 'left' ? rule.val1 : rule.val2;
            const rightVal = rule.dir === 'left' ? rule.val2 : rule.val1;
            patterns.push(evalPatternDotOrder(leftVal, rightVal, remMap, N));
            break;
          }
          case 'THREE_ORDERED': {
            involvedValues = [rule.val1, rule.val2, rule.val3];
            patterns.push(evalPatternThreeDotOrder(rule.val1, rule.val2, rule.val3, remMap, N));
            break;
          }
          case 'POSSIBLE_POS': {
            involvedValues = [rule.val];
            patterns.push({
              expr: `${rule.val} [在 ${rule.pos1} v ${rule.pos2}]`,
              feasMap: { [rule.val]: [rule.pos1, rule.pos2] }
            });
            break;
          }
          case 'SAME_ENTITY': {
            involvedValues = [rule.val1, rule.val2];
            patterns.push(evalPatternSameEntity(rule.val1, rule.val2, remMap, N));
            break;
          }
        }

        // 計算該規則綜合出的「該特徵值所有可行位置」(併集)
        let combinedFeasible = {};
        involvedValues.forEach(v => { combinedFeasible[v] = new Set(); });

        patterns.forEach(p => {
          involvedValues.forEach(v => {
            if (p.feasMap && p.feasMap[v]) {
              p.feasMap[v].forEach(pos => combinedFeasible[v].add(pos));
            }
          });
        });

        // 轉陣列排序
        let finalFeasibleMap = {};
        involvedValues.forEach(v => {
          finalFeasibleMap[v] = Array.from(combinedFeasible[v]).sort((a, b) => a - b);
        });

        results.push({
          ruleDesc: rule.desc,
          patterns: patterns,
          involvedValues: involvedValues,
          feasibleMap: finalFeasibleMap
        });
      });

      return results;
    }

    // 評估模式: A | B (A 在 B 左側隔壁)
    function evalPatternAdjacent(valA, valB, remMap, N) {
      const remA = remMap[valA] || [];
      const remB = remMap[valB] || [];
      let feasA = [], feasB = [];

      for (let posA of remA) {
        let posB = posA + 1;
        if (posB <= N && remB.includes(posB)) {
          if (!feasA.includes(posA)) feasA.push(posA);
          if (!feasB.includes(posB)) feasB.push(posB);
        }
      }

      return {
        expr: `${valA} | ${valB}`,
        feasMap: { [valA]: feasA, [valB]: feasB }
      };
    }

    // 評估模式: A . B (A 在 B 左側，不一定隔壁)
    function evalPatternDotOrder(valA, valB, remMap, N) {
      const remA = remMap[valA] || [];
      const remB = remMap[valB] || [];
      let feasA = [], feasB = [];

      for (let posA of remA) {
        for (let posB of remB) {
          if (posA < posB) {
            if (!feasA.includes(posA)) feasA.push(posA);
            if (!feasB.includes(posB)) feasB.push(posB);
          }
        }
      }

      return {
        expr: `${valA} . ${valB}`,
        feasMap: { [valA]: feasA, [valB]: feasB }
      };
    }

    // 評估模式: A . B . C (三者依序，不一定隔壁)
    function evalPatternThreeDotOrder(valA, valB, valC, remMap, N) {
      const remA = remMap[valA] || [];
      const remB = remMap[valB] || [];
      const remC = remMap[valC] || [];
      let feasA = [], feasB = [], feasC = [];

      for (let posA of remA) {
        for (let posB of remB) {
          if (posA < posB) {
            for (let posC of remC) {
              if (posB < posC) {
                if (!feasA.includes(posA)) feasA.push(posA);
                if (!feasB.includes(posB)) feasB.push(posB);
                if (!feasC.includes(posC)) feasC.push(posC);
              }
            }
          }
        }
      }

      return {
        expr: `${valA} . ${valB} . ${valC}`,
        feasMap: { [valA]: feasA, [valB]: feasB, [valC]: feasC }
      };
    }

    // 評估模式: A = B (確定相同個體)
    function evalPatternSameEntity(valA, valB, remMap, N) {
      const remA = remMap[valA] || [];
      const remB = remMap[valB] || [];
      // 交集
      const common = remA.filter(p => remB.includes(p));

      return {
        expr: `${valA} = ${valB}`,
        feasMap: { [valA]: common, [valB]: common }
      };
    }

    // Step C: 綜合特徵值剩餘位置與所有規則交集，算出最終「特徵值可行位置區」
    function computeFinalFeasiblePositions(remMap, analysisResults) {
      let finalMap = {};

      // 初始化為特徵值剩餘位置 (RemMap)
      Object.keys(remMap).forEach(v => {
        finalMap[v] = new Set(remMap[v]);
      });

      // 對每一個特徵值，拿每一條涉及它的規則算出的可行位置求「交集 (Intersection)」
      analysisResults.forEach(res => {
        res.involvedValues.forEach(v => {
          if (finalMap[v] && res.feasibleMap[v]) {
            const ruleFeasibleSet = new Set(res.feasibleMap[v]);
            finalMap[v] = new Set([...finalMap[v]].filter(x => ruleFeasibleSet.has(x)));
          }
        });
      });

      // 轉換回排序後的陣列
      let resultMap = {};
      Object.keys(finalMap).forEach(v => {
        resultMap[v] = Array.from(finalMap[v]).sort((a, b) => a - b);
      });

      return resultMap;
    }

    // 渲染「規則展示與特徵可行位置區」表格
    function renderRuleAnalysisTable(analysisResults, finalFeasibleMap) {
      const tbody = document.getElementById('rule-analysis-tbody');
      tbody.innerHTML = '';

      if (analysisResults.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted p-3">尚未設定任何規則限制條件。</td></tr>`;
        return;
      }

      // 判斷該規則牽涉的所有特徵值是否在最終結果中都只有 1 個位置 (已確定)
      const isRuleCompleted = (res) => {
        return res.involvedValues.every(v => finalFeasibleMap[v] && finalFeasibleMap[v].length === 1);
      };

      // 複製一份並排序：未完成的排前面 (order=0)，完全確定的排後面 (order=1)
      let sortedResults = [...analysisResults].map((res, originalIndex) => {
        const completed = isRuleCompleted(res);
        return { res, completed, originalIndex };
      }).sort((a, b) => {
        if (a.completed === b.completed) return a.originalIndex - b.originalIndex;
        return a.completed ? 1 : -1;
      });

      sortedResults.forEach(({ res, completed }) => {
        const tr = document.createElement('tr');
        if (completed) {
          tr.className = 'rule-completed'; // 淡化完成規則的 CSS class
        }

        // 排列方式與可行位置子表格 HTML
        let patternSubTable = `<table class="table table-sm table-borderless mb-0">`;
        res.patterns.forEach(p => {
          let details = [];
          Object.keys(p.feasMap).forEach(v => {
            details.push(`${v}: [${p.feasMap[v].join(',') || '無'}]`);
          });
          patternSubTable += `
        <tr>
          <td style="width:40%;"><span class="badge ${completed ? 'bg-secondary' : 'bg-primary-subtle text-primary'} border">${p.expr}</span></td>
          <td style="width:60%;" class="mono text-muted small">${details.join(' | ')}</td>
        </tr>
      `;
        });
        patternSubTable += `</table>`;

        // 牽涉特徵值列表
        let involvedHTML = res.involvedValues.map(v => `<div class="fw-bold">${v}</div>`).join('');

        // 可行位置併集結果
        let feasibleHTML = res.involvedValues.map(v => {
          const posStr = res.feasibleMap[v].length > 0 ? res.feasibleMap[v].join(',') : '無可行解';
          return `<div><span class="badge ${completed ? 'bg-secondary' : 'bg-success'} pos-badge">${posStr}</span></div>`;
        }).join('');

        tr.innerHTML = `
      <td class="fw-bold text-dark">
        ${res.ruleDesc}
        ${completed ? '<span class="badge bg-secondary ms-1">已確定</span>' : ''}
      </td>
      <td class="p-1">${patternSubTable}</td>
      <td class="cell-center bg-light">${involvedHTML}</td>
      <td class="cell-center ${completed ? 'bg-light' : 'bg-possibility'}">${feasibleHTML}</td>
    `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>

</html>
